<script>
(function(){
  var box=document.getElementById('rows-box');
  function fail(t){box.innerHTML='<div>'+t+'</div>';}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
  function key(){var h=new URLSearchParams(location.hash.slice(1)).get('k');if(h){try{sessionStorage.setItem('rows_k',h);}catch(e){}return h;}try{return sessionStorage.getItem('rows_k');}catch(e){return null;}}
  var k=key();
  if(!k){fail('Open this brief from the link Michiel sent you.');return;}
  var ct=document.getElementById('rows-ct').textContent.trim();
  (async function(){
    try{
      var raw=Uint8Array.from(atob(ct),function(c){return c.charCodeAt(0);});
      var ck=await crypto.subtle.importKey('raw',b64u(k),{name:'AES-GCM'},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},ck,raw.slice(12));
      var html=new TextDecoder().decode(pt);
      document.open();document.write(html);document.close();
    }catch(e){fail('This link is invalid or out of date. Ask Michiel for a fresh link.');}
  })();
})();
</script>
